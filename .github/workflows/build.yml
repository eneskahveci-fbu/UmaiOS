name: Build and deploy UmaiOS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The full build takes ~70 min; cap the job so a hung step fails in a
    # reasonable time instead of burning the 6-hour default (an apt-get
    # that stalled on a dpkg lock once cost exactly that).
    timeout-minutes: 150
    steps:
      - name: Check out UmaiOS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Buildroot host dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Wait for (rather than fight) the runner's background
          # unattended-upgrades holding the dpkg lock.
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq -o DPkg::Lock::Timeout=300 \
            cpio rsync build-essential unzip bc libncurses-dev git

      # Restore/save are split (rather than actions/cache) so the download
      # cache is still written when a later step fails - otherwise a failed
      # build throws away an hour of downloads.
      - name: Restore Buildroot downloads
        id: dl-cache
        uses: actions/cache/restore@v4
        with:
          path: buildroot-dl
          key: buildroot-dl-${{ hashFiles('configs/umaios_x86_64_defconfig', 'board/umaios/linux.config') }}
          restore-keys: |
            buildroot-dl-

      - name: Build UmaiOS
        env:
          BR2_DL_DIR: ${{ github.workspace }}/buildroot-dl
        run: |
          mkdir -p "$BR2_DL_DIR"
          ./build.sh

      - name: Save Buildroot downloads
        if: always() && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: buildroot-dl
          key: buildroot-dl-${{ hashFiles('configs/umaios_x86_64_defconfig', 'board/umaios/linux.config') }}

      - name: Boot-test the image in QEMU
        run: |
          sudo apt-get install -y -qq qemu-system-x86
          # Boot exactly what the web page boots: kernel + initramfs, serial
          # console, and the initramfs's own /init.
          # e1000 is QEMU's default NIC for -M pc; pin it explicitly so this
          # also regression-tests that the kernel can actually drive it.
          timeout 180 qemu-system-x86_64 \
            -M pc -m 256M \
            -kernel output/images/bzImage \
            -initrd output/images/rootfs.cpio.gz \
            -append "console=ttyS0" \
            -nic user,model=e1000 \
            -nographic -no-reboot \
            </dev/null >boot.log 2>&1 || true
          echo "===== serial output ====="
          cat boot.log
          echo "========================="
          grep -q "Welcome to UmaiOS" boot.log \
            || { echo "FAIL: /etc/issue never printed - userspace did not come up"; exit 1; }
          grep -q "login:" boot.log \
            || { echo "FAIL: no login prompt - getty did not start"; exit 1; }
          # Don't match "Starting network: OK" as one string: the e1000 link
          # message and udhcpc's output interleave between the label and its
          # trailing OK. Assert on the driver binding and the DHCP lease,
          # which is what actually proves networking works.
          grep -q "eth0 NIC Link is Up" boot.log \
            || { echo "FAIL: e1000 driver never brought eth0 up"; exit 1; }
          grep -qE "lease of [0-9.]+ obtained" boot.log \
            || { echo "FAIL: no DHCP lease on eth0"; exit 1; }
          echo "PASS: UmaiOS booted to a login prompt with networking up."

      # Publish the images even when the boot test fails: they are what you
      # need to reproduce the failure locally, and a broken assertion should
      # not leave the run with nothing downloadable. The job still fails.
      - name: Upload installable disk image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umaios-images
          path: |
            output/images/bzImage
            output/images/rootfs.ext4
            output/images/rootfs.cpio.gz
            output/images/start-qemu.sh
          if-no-files-found: error

      # Self-contained browser bundle: web page + vendored v86/xterm.js +
      # the boot images post-image.sh copied into web/boot. Downloading and
      # serving this one directory is all it takes to run UmaiOS in a
      # browser, with no repository clone (the Pages artifact below is kept
      # for deployment, but expires after a day).
      - name: Upload browser bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umaios-web
          path: web
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
